<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lua Script Deobfuscator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      padding: 0 24px;
      border-bottom: 1px solid #27272a;
      background: #0d0d10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .header-meta {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(340px, 460px) 1fr;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .left-pane {
      border-right: 1px solid #27272a;
      background: #0d0d10;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .right-pane {
      background: #09090b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
    }
    textarea {
      width: 100%;
      min-height: 130px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      color: #e4e4e7;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #ef4444; }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: #dc2626; color: #fff; flex: 1; }
    .btn-primary:hover:not(:disabled) { background: #b91c1c; }
    .btn-secondary { background: #18181b; color: #e4e4e7; border: 1px solid #27272a; }
    .btn-secondary:hover:not(:disabled) { background: #27272a; }
    .error-box {
      border: 1px solid #7f1d1d;
      background: rgba(127, 29, 29, 0.25);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      display: none;
    }
    .meta-strip {
      font-size: 12px;
      color: #a1a1aa;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }
    .meta-strip strong { color: #f4f4f5; }
    .stages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stage-card {
      border: 1px solid #27272a;
      background: #111114;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .stage-status { font-size: 11px; color: #4ade80; }
    .stage-status.err { color: #f87171; }
    .stage-summary {
      margin-top: 4px;
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.45;
      word-break: break-word;
    }
    details { margin-top: 6px; }
    summary {
      font-size: 11px;
      color: #71717a;
      cursor: pointer;
    }
    pre.stage-pre {
      margin: 6px 0 0;
      padding: 8px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #d4d4d8;
      overflow-x: auto;
      max-height: 140px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .out-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .out-title {
      font-size: 14px;
      font-weight: 600;
    }
    .out-sub {
      font-size: 12px;
      color: #a1a1aa;
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }
    .code-box {
      flex: 1;
      border: 1px solid #27272a;
      background: #0d0d10;
      border-radius: 10px;
      overflow: auto;
      padding: 16px;
      min-height: 360px;
    }
    .code-box pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #e4e4e7;
      white-space: pre;
    }
    .placeholder {
      color: #71717a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Lua Script Deobfuscator</div>
    <div class="header-meta">Multi-Layer Loader &amp; Cipher Decoder</div>
  </header>

  <main>
    <section class="left-pane">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label for="script-input">วางสคริปต์ Lua / Loader ที่ต้องการถอดรหัส</label>
        <textarea id="script-input" placeholder='loadstring(game:HttpGet("https://raw.githubusercontent.com/GhostPlayer352/Test4/refs/heads/main/Auth"))()Ioad("934be1c208a3b7d829ae863ad1983dff")'></textarea>
        <div class="btn-row">
          <button class="btn-primary" id="btn-run">ถอดรหัสสคริปต์</button>
          <button class="btn-secondary" id="btn-sample">ใส่ตัวอย่าง</button>
          <button class="btn-secondary" id="btn-clear">ล้าง</button>
        </div>
      </div>

      <div class="error-box" id="error-box"></div>
      <div class="meta-strip" id="meta-strip" style="display:none;"></div>
      <div class="stages" id="stages-list"></div>
    </section>

    <section class="right-pane">
      <div class="out-header">
        <div>
          <div class="out-title">ซอสโค้ดจริงที่ถอดรหัสแล้ว</div>
          <div class="out-sub" id="output-stats">ยังไม่มีผลลัพธ์</div>
        </div>
        <div class="btn-row">
          <button class="btn-secondary" id="btn-download-lua" disabled>Download .lua</button>
          <button class="btn-primary" id="btn-copy-lua" style="flex:0;" disabled>Copy Source</button>
        </div>
      </div>

      <div class="code-box">
        <pre id="code-output"><span class="placeholder">วางสคริปต์ทางซ้ายแล้วกด "ถอดรหัสสคริปต์" เพื่อดึงและถอดรหัสทุกชั้นจนได้ซอสโค้ดจริง</span></pre>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const API_ORIGIN = "https://ais-dev-sx5zqeegbwmtitmcziohqy-396192244470.asia-southeast1.run.app";
      const SAMPLE = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/GhostPlayer352/Test4/refs/heads/main/Auth"))()Ioad("934be1c208a3b7d829ae863ad1983dff")';

      const inputEl = document.getElementById("script-input");
      const runBtn = document.getElementById("btn-run");
      const sampleBtn = document.getElementById("btn-sample");
      const clearBtn = document.getElementById("btn-clear");
      const errorBox = document.getElementById("error-box");
      const metaStrip = document.getElementById("meta-strip");
      const stagesList = document.getElementById("stages-list");
      const codeOutput = document.getElementById("code-output");
      const outputStats = document.getElementById("output-stats");
      const copyBtn = document.getElementById("btn-copy-lua");
      const downloadBtn = document.getElementById("btn-download-lua");

      let currentFinalCode = "";

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
        }
        return Promise.resolve(fallbackCopy(text));
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e) { return false; }
      }

      function decodeDecimalLocal(str) {
        return str.replace(/\\(\d{1,3})/g, function (_, n) {
          return String.fromCharCode(Number(n));
        });
      }

      function renderResult(data) {
        stagesList.innerHTML = "";
        metaStrip.style.display = "none";
        metaStrip.innerHTML = "";
        errorBox.style.display = "none";

        if (!data.success && data.error) {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
        }

        const metaParts = [];
        if (data.scriptName) metaParts.push("<span>Script: <strong>" + escapeHtml(data.scriptName) + "</strong></span>");
        if (data.hash) metaParts.push("<span>Hash: <strong>" + escapeHtml(data.hash) + "</strong></span>");
        if (metaParts.length) {
          metaStrip.innerHTML = metaParts.join("<span>·</span>");
          metaStrip.style.display = "flex";
        }

        (data.stages || []).forEach(function (st) {
          const card = document.createElement("div");
          card.className = "stage-card";
          const isErr = st.status === "error";
          card.innerHTML =
            '<div class="stage-head"><span>Stage ' + st.stage + ': ' + escapeHtml(st.title) + '</span>' +
            '<span class="stage-status ' + (isErr ? "err" : "") + '">' + (isErr ? "Failed" : "Done") + '</span></div>' +
            '<div class="stage-summary">' + escapeHtml(st.summary || "") + '</div>' +
            (st.preview ? '<details><summary>ดูข้อมูลในชั้นนี้</summary><pre class="stage-pre">' + escapeHtml(st.preview) + '</pre></details>' : '');
          stagesList.appendChild(card);
        });

        currentFinalCode = data.finalCode || "";
        if (currentFinalCode) {
          codeOutput.textContent = currentFinalCode;
          const lines = currentFinalCode.split("\n").length;
          const kb = (new Blob([currentFinalCode]).size / 1024).toFixed(1);
          outputStats.textContent = lines + " lines · " + kb + " KB";
          copyBtn.disabled = false;
          downloadBtn.disabled = false;
        } else {
          codeOutput.innerHTML = '<span class="placeholder">ไม่พบซอสโค้ดปลายทาง</span>';
          outputStats.textContent = "ยังไม่มีผลลัพธ์";
          copyBtn.disabled = true;
          downloadBtn.disabled = true;
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      sampleBtn.addEventListener("click", function () {
        inputEl.value = SAMPLE;
      });

      clearBtn.addEventListener("click", function () {
        inputEl.value = "";
        stagesList.innerHTML = "";
        metaStrip.style.display = "none";
        errorBox.style.display = "none";
        currentFinalCode = "";
        codeOutput.innerHTML = '<span class="placeholder">วางสคริปต์ทางซ้ายแล้วกด "ถอดรหัสสคริปต์"</span>';
        outputStats.textContent = "ยังไม่มีผลลัพธ์";
        copyBtn.disabled = true;
        downloadBtn.disabled = true;
      });

      runBtn.addEventListener("click", async function () {
        const raw = inputEl.value.trim();
        if (!raw) return;

        // Offline local shortcut for pure decimal-escaped string without URLs
        if (/loadstring\s*\(\s*"(?:\\\d{1,3})+/.test(raw) && !/https?:\/\//i.test(raw)) {
          const m = raw.match(/loadstring\s*\(\s*"([^"]+)"\s*\)/);
          const decoded = decodeDecimalLocal(m ? m[1] : raw);
          renderResult({
            success: true,
            stages: [{ stage: 1, title: "Local Decimal Escape Decoder", status: "done", summary: "ถอดรหัสแบบออฟไลน์สำเร็จ", preview: decoded.slice(0, 400) }],
            finalCode: decoded
          });
          return;
        }

        runBtn.disabled = true;
        runBtn.textContent = "กำลังประมวลผล...";
        errorBox.style.display = "none";

        try {
          const endpoint = (API_ORIGIN || window.location.origin) + "/api/deobfuscate";
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ input: raw })
          });
          const data = await res.json();
          renderResult(data);
        } catch (err) {
          errorBox.textContent = "เชื่อมต่อตัวประมวลผลไม่สำเร็จ: " + (err && err.message ? err.message : "Network error");
          errorBox.style.display = "block";
        } finally {
          runBtn.disabled = false;
          runBtn.textContent = "ถอดรหัสสคริปต์";
        }
      });

      copyBtn.addEventListener("click", async function () {
        if (!currentFinalCode) return;
        const ok = await copyText(currentFinalCode);
        if (ok) {
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy Source"; }, 1800);
        }
      });

      downloadBtn.addEventListener("click", function () {
        if (!currentFinalCode) return;
        const blob = new Blob([currentFinalCode], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "decoded-script.lua";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
